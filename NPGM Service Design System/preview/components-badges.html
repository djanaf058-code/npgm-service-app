<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
.row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
.badge { display:inline-flex; align-items:center; padding:2px 8px; border-radius:6px; font-family:var(--font-body); font-size:12px; font-weight:500; white-space:nowrap; }
.ring { box-shadow: inset 0 0 0 1px currentColor; }
.b-default { background:#f0f6ff; color:#1e40af; box-shadow: inset 0 0 0 1px #b8d3ff; }
.b-success { background:#ecfdf5; color:#047857; box-shadow: inset 0 0 0 1px #a7f3d0; }
.b-warning { background:#fffbeb; color:#b45309; box-shadow: inset 0 0 0 1px #fde68a; }
.b-destructive { background:#fef2f2; color:#b91c1c; box-shadow: inset 0 0 0 1px #fecaca; }
.b-secondary { background:#f1f5f9; color:#334155; box-shadow: inset 0 0 0 1px #e2e8f0; }
.b-outline { background:transparent; color:#334155; box-shadow: inset 0 0 0 1px #cbd5e1; }
.note { font-family:var(--font-body); font-size:12px; color:var(--fg-3); }
</style></head>
<body>
<div class="card">
  <div class="label-xs">Badges — shadcn variants</div>
  <div class="row">
    <span class="badge b-default">МЗВ</span>
    <span class="badge b-default">МСЗУ</span>
    <span class="badge b-success">В работе</span>
    <span class="badge b-success">Закрыта</span>
    <span class="badge b-warning">Идёт</span>
    <span class="badge b-warning">ТО через 380 т</span>
    <span class="badge b-destructive">Заблокирована</span>
    <span class="badge b-destructive">P1 · Critical</span>
    <span class="badge b-secondary">Запланирована</span>
    <span class="badge b-secondary">Выведена</span>
    <span class="badge b-outline">draft</span>
  </div>
  <div class="note">All badges: <code>rounded-md px-2 py-0.5 text-xs font-medium ring-1 ring-inset</code></div>
</div>
</body></html>
