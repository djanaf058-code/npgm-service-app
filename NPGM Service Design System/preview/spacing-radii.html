<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
.row { display:flex; gap:24px; flex-wrap:wrap; }
.demo { display:flex; flex-direction:column; gap:8px; align-items:flex-start; }
.r { background:white; border:1px solid var(--border-1); width:110px; height:64px; display:flex; align-items:center; justify-content:center; font-family:var(--font-mono); font-size:12px; color:var(--fg-2); }
.lbl { font-family:var(--font-body); font-size:12px; color:var(--fg-3); }
.lbl b { color:var(--fg-1); font-weight:600; }
</style></head>
<body>
<div class="card">
  <div class="label-xs">Corner radii</div>
  <div class="row">
    <div class="demo"><div class="r" style="border-radius:4px">4px</div><div class="lbl"><b>--radius-sm</b> · inputs, chips</div></div>
    <div class="demo"><div class="r" style="border-radius:8px">8px</div><div class="lbl"><b>--radius-md</b> · buttons, cards</div></div>
    <div class="demo"><div class="r" style="border-radius:12px">12px</div><div class="lbl"><b>--radius-lg</b> · modals</div></div>
    <div class="demo"><div class="r" style="border-radius:999px">pill</div><div class="lbl"><b>--radius-pill</b> · lang switch, FAB</div></div>
  </div>
</div>
</body></html>
