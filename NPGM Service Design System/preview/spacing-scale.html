<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
.row { display:flex; gap:16px; flex-wrap:wrap; align-items:flex-end; }
.box { background: var(--npgm-indigo); border-radius: 4px; }
.tok { display:flex; flex-direction:column; align-items:center; gap:8px; }
.tok .lbl { font-family:var(--font-mono); font-size:11px; color:var(--fg-3); }
.tok .px { font-family:var(--font-body); font-size:12px; color:var(--fg-1); font-weight:600; }
</style></head>
<body>
<div class="card">
  <div class="label-xs">Spacing — 4-px base grid</div>
  <div class="row">
    <div class="tok"><div class="box" style="width:4px;height:4px"></div><div class="px">4</div><div class="lbl">--space-1</div></div>
    <div class="tok"><div class="box" style="width:8px;height:8px"></div><div class="px">8</div><div class="lbl">--space-2</div></div>
    <div class="tok"><div class="box" style="width:12px;height:12px"></div><div class="px">12</div><div class="lbl">--space-3</div></div>
    <div class="tok"><div class="box" style="width:16px;height:16px"></div><div class="px">16</div><div class="lbl">--space-4</div></div>
    <div class="tok"><div class="box" style="width:20px;height:20px"></div><div class="px">20</div><div class="lbl">--space-5</div></div>
    <div class="tok"><div class="box" style="width:24px;height:24px"></div><div class="px">24</div><div class="lbl">--space-6</div></div>
    <div class="tok"><div class="box" style="width:32px;height:32px"></div><div class="px">32</div><div class="lbl">--space-8</div></div>
    <div class="tok"><div class="box" style="width:40px;height:40px"></div><div class="px">40</div><div class="lbl">--space-10</div></div>
    <div class="tok"><div class="box" style="width:48px;height:48px"></div><div class="px">48</div><div class="lbl">--space-12</div></div>
    <div class="tok"><div class="box" style="width:64px;height:64px"></div><div class="px">64</div><div class="lbl">--space-16</div></div>
  </div>
</div>
</body></html>
