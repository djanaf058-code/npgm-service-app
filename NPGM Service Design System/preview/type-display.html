<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
.row { display:flex; gap:24px; align-items:baseline; flex-wrap:wrap; }
.spec { flex:1; min-width:0; }
.spec .text { font-family: var(--font-heading); font-weight:700; color:var(--fg-1); letter-spacing:-0.02em; line-height:1.05; }
.tag { font-family:var(--font-mono); font-size:11px; color:var(--fg-3); margin-top:6px; }
</style></head>
<body>
<div class="card">
  <div class="label-xs">Display & Headings — IBM Plex Sans</div>
  <div class="row">
    <div class="spec">
      <div class="text" style="font-size:48px">Один контур</div>
      <div class="tag">Display · 48 / 700 · -0.02em</div>
    </div>
  </div>
  <div class="row">
    <div class="spec">
      <div class="text" style="font-size:32px">Парк техники</div>
      <div class="tag">H1 · 32 / 700</div>
    </div>
    <div class="spec">
      <div class="text" style="font-size:24px; font-weight:600">Fleet overview</div>
      <div class="tag">H2 · 24 / 600</div>
    </div>
  </div>
</div>
</body></html>
