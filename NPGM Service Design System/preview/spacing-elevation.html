<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
.row { display:flex; gap:32px; flex-wrap:wrap; }
.demo { display:flex; flex-direction:column; gap:10px; align-items:flex-start; }
.r { background:white; width:170px; height:80px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-family:var(--font-mono); font-size:12px; color:var(--fg-2); }
.lbl { font-family:var(--font-body); font-size:12px; color:var(--fg-3); max-width:200px; }
.lbl b { color:var(--fg-1); font-weight:600; }
</style></head>
<body>
<div class="card">
  <div class="label-xs">Elevation — two tiers only</div>
  <div class="row">
    <div class="demo">
      <div class="r" style="border:1px solid var(--border-1)">border only</div>
      <div class="lbl"><b>Border</b> · default for dense layouts (tables, fleet)</div>
    </div>
    <div class="demo">
      <div class="r" style="box-shadow:0 1px 2px rgba(15,23,42,0.04); border:1px solid var(--border-1)">shadow-sm</div>
      <div class="lbl"><b>--shadow-sm</b> · resting cards</div>
    </div>
    <div class="demo">
      <div class="r" style="box-shadow:0 4px 12px rgba(15,23,42,0.08); border:1px solid var(--border-1)">shadow-md</div>
      <div class="lbl"><b>--shadow-md</b> · popovers, modals, menus</div>
    </div>
  </div>
</div>
</body></html>
