<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
.row { display:flex; gap:16px; flex-wrap:wrap; }
.field { display:flex; flex-direction:column; gap:6px; flex:1; min-width:200px; }
label { font-family:var(--font-body); font-size:14px; font-weight:500; color:#334155; }
.input { font-family:var(--font-body); font-size:14px; padding:8px 12px; border:1px solid #cbd5e1; border-radius:6px; background:white; height:40px; box-sizing:border-box; color:#0f172a; box-shadow: 0 1px 2px rgba(15,23,42,0.04); }
.input::placeholder { color:#94a3b8; }
.input.focused { border-color:#2563eb; outline: none; box-shadow:0 0 0 1px #2563eb; }
.input.error { border-color:#dc2626; }
.help { font-family:var(--font-body); font-size:12px; color:var(--fg-3); }
.help.err { color:#b91c1c; }
.alert { background:#fef2f2; border:1px solid #fecaca; color:#b91c1c; padding:10px 12px; border-radius:6px; font-size:13px; }
</style></head>
<body>
<div class="card">
  <div class="label-xs">Inputs · matches the auth login form</div>
  <div class="row">
    <div class="field">
      <label>Email</label>
      <input class="input" placeholder="operator@npgm.ru">
    </div>
    <div class="field">
      <label>Password</label>
      <input class="input focused" type="password" value="••••••••">
      <div class="help">Focused — border + 1px ring primary-500</div>
    </div>
  </div>
  <div class="alert">Invalid login credentials</div>
</div>
</body></html>
