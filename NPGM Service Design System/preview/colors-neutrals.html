<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
.row { display:flex; gap:0; border-radius:8px; overflow:hidden; border:1px solid var(--border-1); }
.cell { flex:1; height:64px; display:flex; align-items:flex-end; justify-content:space-between; padding:8px 10px; font-family:var(--font-mono); font-size:11px; }
.cell.light { color: #0f172a; }
.cell.dark { color: white; }
.cell b { font-family:var(--font-body); font-weight:600; }
.note { font-size:12px; color:var(--fg-3); margin-top:6px; }
</style></head>
<body>
<div class="card">
  <div class="label-xs">secondary — slate (also the neutrals)</div>
  <div class="row">
    <div class="cell light" style="background:#f8fafc"><b>50</b><span>f8fafc</span></div>
    <div class="cell light" style="background:#f1f5f9"><b>100</b><span>f1f5f9</span></div>
    <div class="cell light" style="background:#e2e8f0"><b>200</b><span>e2e8f0</span></div>
    <div class="cell light" style="background:#cbd5e1"><b>300</b><span>cbd5e1</span></div>
    <div class="cell light" style="background:#94a3b8"><b>400</b><span>94a3b8</span></div>
    <div class="cell dark" style="background:#64748b"><b>500</b><span>64748b</span></div>
    <div class="cell dark" style="background:#475569"><b>600</b><span>475569</span></div>
    <div class="cell dark" style="background:#334155"><b>700</b><span>334155</span></div>
    <div class="cell dark" style="background:#1e293b"><b>800</b><span>1e293b</span></div>
    <div class="cell dark" style="background:#0f172a"><b>900</b><span>0f172a</span></div>
  </div>
  <div class="note"><b style="color:var(--fg-1)">200</b> is the default border. <b style="color:var(--fg-1)">500–700</b> are body/heading text. <b style="color:var(--fg-1)">900</b> appears at the dark end of the mesh gradient.</div>
</div>
</body></html>
