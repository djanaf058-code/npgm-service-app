<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
.swatch { display:flex; flex-direction:column; gap:6px; flex:1; min-width:120px; }
.chip { height:88px; border-radius:8px; border:1px solid var(--border-1); display:flex; align-items:flex-end; padding:10px; color:white; font-family:var(--font-mono); font-size:12px; }
.chip.dark-text { color: var(--color-secondary-900); }
.meta { display:flex; justify-content:space-between; font-size:12px; color:var(--fg-3); font-family:var(--font-mono); }
.meta b { font-family:var(--font-body); font-weight:600; color:var(--fg-1); font-size:13px; }
.note { font-size:12px; color:var(--fg-3); margin-top:-4px; }
</style></head>
<body>
<div class="card">
  <div class="note">Brand blue. <strong style="color:var(--fg-1)">600 is the default</strong> for buttons & links.</div>
  <div class="card-row">
    <div class="swatch">
      <div class="chip" style="background:#2563eb">#2563eb</div>
      <div class="meta"><b>primary-500</b><span>brand blue</span></div>
    </div>
    <div class="swatch">
      <div class="chip" style="background:#1d4ed8">#1d4ed8</div>
      <div class="meta"><b>primary-600</b><span>default</span></div>
    </div>
    <div class="swatch">
      <div class="chip" style="background:#1e40af">#1e40af</div>
      <div class="meta"><b>primary-700</b><span>hover</span></div>
    </div>
    <div class="swatch">
      <div class="chip dark-text" style="background:#dbe9ff">#dbe9ff</div>
      <div class="meta"><b>primary-100</b><span>bg subtle</span></div>
    </div>
    <div class="swatch">
      <div class="chip dark-text" style="background:#f0f6ff">#f0f6ff</div>
      <div class="meta"><b>primary-50</b><span>bg tint</span></div>
    </div>
  </div>
</div>
</body></html>
