<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
body { padding:24px; }
.hero { position:relative; border-radius:12px; overflow:hidden; height:200px;
  background-color:#0b1437;
  background-image:
    radial-gradient(at 78% 8%,  #6366f1 0px, transparent 55%),
    radial-gradient(at 12% 22%, #1d4ed8 0px, transparent 50%),
    radial-gradient(at 88% 80%, #a855f7 0px, transparent 50%),
    radial-gradient(at 18% 88%, #312e81 0px, transparent 55%),
    radial-gradient(at 50% 50%, #1e3a8a 0px, transparent 60%);
}
.hero::after { content:""; position:absolute; inset:0;
  background-image:
    linear-gradient(to right, rgba(255,255,255,0.06) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(255,255,255,0.06) 1px, transparent 1px);
  background-size:40px 40px;
}
.label { position:absolute; left:24px; top:24px; right:24px; color:white; z-index:2; }
.label .eb { font-family:var(--font-body); font-size:11px; font-weight:600; color:#dbe9ff; letter-spacing:0.06em; text-transform:uppercase; }
.label h2 { color:white; font-family:var(--font-heading); font-size:24px; font-weight:700; margin:6px 0 0; letter-spacing:-0.01em; }
.stripe { position:absolute; right:0; top:0; bottom:0; width:3px; background:#dc2626; z-index:3; }
.note { font-family:var(--font-body); font-size:12px; color:var(--fg-3); margin-top:8px; }
</style></head>
<body>
<div class="card">
  <div class="label-xs">Signature motif — mesh-gradient hero</div>
  <div class="hero">
    <div class="label">
      <div class="eb">Service manager</div>
      <h2>Hello, Andrey</h2>
    </div>
    <div class="stripe"></div>
  </div>
  <div class="note">Base <code>#0b1437</code> · 5 radial blobs (indigo / blue / violet / deep-indigo / slate-blue) · 40 px white grid at 6% opacity · accent-600 red 1 px right-edge stripe. Used on the landing hero, dashboard hero card, and auth side-panel.</div>
</div>
</body></html>
