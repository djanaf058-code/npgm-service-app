<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
.row { display:flex; gap:32px; flex-wrap:wrap; }
.spec { flex:1; min-width:0; }
.tag { font-family:var(--font-mono); font-size:11px; color:var(--fg-3); margin-top:6px; }
.mono { font-family: 'IBM Plex Mono', ui-monospace, monospace; color:var(--fg-1); }
.kv { display:flex; gap:14px; align-items:baseline; }
.kv .k { font-family:var(--font-body); font-size:13px; color:var(--fg-3); width:110px; }
.kv .v { font-family:'IBM Plex Mono', monospace; font-size:14px; color:var(--fg-1); }
</style></head>
<body>
<div class="card">
  <div class="label-xs">Mono — IBM Plex Mono (codes, SKUs, serials)</div>
  <div class="row">
    <div class="spec">
      <div class="mono" style="font-size:20px">MEMU-04-RU / SN-882104</div>
      <div class="tag">SKU · 20 / 500</div>
    </div>
  </div>
  <div class="row" style="flex-direction:column; gap:6px">
    <div class="kv"><div class="k">Part number</div><div class="v">NPGM-FLT-001-2024</div></div>
    <div class="kv"><div class="k">Operating hours</div><div class="v">1 248 ч</div></div>
    <div class="kv"><div class="k">Next ТО</div><div class="v">2026-06-12 · 21 дн.</div></div>
  </div>
</div>
</body></html>
