<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
body { padding:24px; }
.row { display:grid; grid-template-columns:repeat(4, 1fr); gap:12px; }
.kpi { display:flex; align-items:center; gap:12px; background:white; border:1px solid #e2e8f0; border-radius:12px; padding:14px; }
.ic { flex-shrink:0; width:40px; height:40px; border-radius:8px; display:grid; place-items:center; }
.ic-primary { background:#f0f6ff; color:#1e40af; }
.ic-success { background:#ecfdf5; color:#047857; }
.ic-warning { background:#fffbeb; color:#b45309; }
.ic-destructive { background:#fef2f2; color:#b91c1c; }
.lbl { font-family:var(--font-body); font-size:11px; color:#64748b; font-weight:500; text-transform:uppercase; letter-spacing:0.04em; }
.val { font-family:var(--font-heading); font-size:24px; font-weight:700; color:#0f172a; font-variant-numeric: tabular-nums; line-height:1.1; }
</style></head>
<body>
<div class="card">
  <div class="label-xs">KPI tile — dashboard 2×4 grid</div>
  <div class="row">
    <div class="kpi">
      <div class="ic ic-primary"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2"/><path d="M15 18H9"/><path d="M19 18h2a1 1 0 0 0 1-1v-3.65a1 1 0 0 0-.22-.624l-3.48-4.35A1 1 0 0 0 17.52 8H14"/><circle cx="17" cy="18" r="2"/><circle cx="7" cy="18" r="2"/></svg></div>
      <div><div class="lbl">Active machines</div><div class="val">24</div></div>
    </div>
    <div class="kpi">
      <div class="ic ic-warning"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg></div>
      <div><div class="lbl">Maintenance ahead</div><div class="val">11</div></div>
    </div>
    <div class="kpi">
      <div class="ic ic-success"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg></div>
      <div><div class="lbl">Parts requests</div><div class="val">7</div></div>
    </div>
    <div class="kpi">
      <div class="ic ic-destructive"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></div>
      <div><div class="lbl">Open tickets</div><div class="val">3</div></div>
    </div>
  </div>
</div>
</body></html>
