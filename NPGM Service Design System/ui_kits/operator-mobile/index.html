// Android.jsx — Simplified Android (Material 3) device frame
// Status bar + top app bar + content + gesture nav + keyboard.
// Based on Figma M3 spec. No dependencies, no image assets.

const MD_C = {
  surface: '#f4fbf8',
  surfaceVariant: '#dae5e1',
  inverseOnSurface: '#ecf2ef',
  secondaryContainer: '#cde8e1',
  primaryFixedDim: '#83d5c6',
  onSurface: '#171d1b',
  onSurfaceVar: '#49454f',
  onPrimaryContainer: '#00201c',
  primary: '#006a60',
  frameBorder: 'rgba(116,119,117,0.5)',
};

// ─────────────────────────────────────────────────────────────
// Status bar (time left, wifi/cell/battery right)
// ─────────────────────────────────────────────────────────────
function AndroidStatusBar({ dark = false }) {
  const c = dark ? '#fff' : MD_C.onSurface;
  return (
    <div style={{
      height: 40, display: 'flex', alignItems: 'center',
      justifyContent: 'space-between', padding: '0 16px',
      position: 'relative',
      fontFamily: 'Roboto, system-ui, sans-serif',
    }}>
      {/* time left */}
      <div style={{ width: 128, display: 'flex', alignItems: 'center', gap: 8 }}>
        <span style={{ fontSize: 14, fontWeight: 400, letterSpacing: 0.25, lineHeight: '20px', color: c }}>9:30</span>
      </div>
      {/* camera punch-hole (center) */}
      <div style={{
        position: 'absolute', left: '50%', top: 8, transform: 'translateX(-50%)',
        width: 24, height: 24, borderRadius: 100, background: '#2e2e2e',
      }} />
      {/* status icons right */}
      <div style={{ display: 'flex', alignItems: 'center' }}>
        <div style={{ display: 'flex', paddingRight: 2 }}>
          <svg width="16" height="16" viewBox="0 0 16 16" style={{ marginRight: -2 }}>
            <path d="M8 13.3L.67 5.97a10.37 10.37 0 0114.66 0L8 13.3z" fill={c}/>
          </svg>
          <svg width="16" height="16" viewBox="0 0 16 16" style={{ marginRight: -2 }}>
            <path d="M14.67 14.67V1.33L1.33 14.67h13.34z" fill={c}/>
          </svg>
        </div>
        <svg width="16" height="16" viewBox="0 0 16 16">
          <rect x="3.75" y="2" width="8.5" height="13" rx="1.5" fill={c}/>
          <rect x="5.5" y="0.9" width="5" height="2" rx="0.5" fill={c}/>
        </svg>
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Top app bar (Material 3 small/medium)
// ─────────────────────────────────────────────────────────────
function AndroidAppBar({ title = 'Title', large = false }) {
  const iconDot = (
    <div style={{
      width: 48, height: 48, display: 'flex', alignItems: 'center', justifyContent: 'center',
    }}>
      <div style={{ width: 22, height: 22, borderRadius: '50%', background: MD_C.onSurfaceVar, opacity: 0.3 }} />
    </div>
  );
  return (
    <div style={{ background: MD_C.surface, padding: '4px 4px 0' }}>
      <div style={{ height: 56, display: 'flex', alignItems: 'center', gap: 4 }}>
        {iconDot}
        {!large && (
          <span style={{
            flex: 1, fontSize: 22, fontWeight: 400, color: MD_C.onSurface,
            fontFamily: 'Roboto, system-ui, sans-serif',
          }}>{title}</span>
        )}
        {large && <div style={{ flex: 1 }} />}
        {iconDot}
      </div>
      {large && (
        <div style={{
          padding: '16px 16px 20px',
          fontSize: 28, fontWeight: 400, color: MD_C.onSurface,
          fontFamily: 'Roboto, system-ui, sans-serif',
        }}>{title}</div>
      )}
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// List item (Material 3)
// ─────────────────────────────────────────────────────────────
function AndroidListItem({ headline, supporting, leading }) {
  return (
    <div style={{
      display: 'flex', alignItems: 'center', gap: 16,
      padding: '12px 16px', minHeight: 56, boxSizing: 'border-box',
      fontFamily: 'Roboto, system-ui, sans-serif',
    }}>
      {leading && (
        <div style={{
          width: 40, height: 40, borderRadius: '50%',
          background: MD_C.primary, color: '#fff',
          display: 'flex', alignItems: 'center', justifyContent: 'center',
          fontSize: 18, fontWeight: 500, flexShrink: 0,
        }}>{leading}</div>
      )}
      <div style={{ flex: 1, minWidth: 0 }}>
        <div style={{ fontSize: 16, color: MD_C.onSurface, lineHeight: '24px' }}>{headline}</div>
        {supporting && (
          <div style={{ fontSize: 14, color: MD_C.onSurfaceVar, lineHeight: '20px' }}>{supporting}</div>
        )}
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Gesture nav bar (pill)
// ─────────────────────────────────────────────────────────────
function AndroidNavBar({ dark = false }) {
  return (
    <div style={{
      height: 24, display: 'flex', alignItems: 'center', justifyContent: 'center',
    }}>
      <div style={{
        width: 108, height: 4, borderRadius: 2,
        background: dark ? '#fff' : MD_C.onSurface, opacity: 0.4,
      }} />
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Device frame — wraps everything
// ─────────────────────────────────────────────────────────────
function AndroidDevice({
  children, width = 412, height = 892, dark = false,
  title, large = false, keyboard = false,
}) {
  return (
    <div style={{
      width, height, borderRadius: 18, overflow: 'hidden',
      background: dark ? '#1d1b20' : MD_C.surface,
      border: `8px solid ${MD_C.frameBorder}`,
      boxShadow: '0 30px 80px rgba(0,0,0,0.25)',
      display: 'flex', flexDirection: 'column', boxSizing: 'border-box',
    }}>
      <AndroidStatusBar dark={dark} />
      {title !== undefined && <AndroidAppBar title={title} large={large} />}
      <div style={{ flex: 1, overflow: 'auto' }}>
        {children}
      </div>
      {keyboard && <AndroidKeyboard />}
      <AndroidNavBar dark={dark} />
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Keyboard — Gboard (Material 3)
// ─────────────────────────────────────────────────────────────
function AndroidKeyboard() {
  let _k = 0;
  const key = (l, { flex = 1, bg = MD_C.surface, r = 6, minW, fs = 21 } = {}) => (
    <div key={_k++} style={{
      height: 46, borderRadius: r, flex, minWidth: minW,
      background: bg, display: 'flex', alignItems: 'center', justifyContent: 'center',
      fontFamily: 'Roboto, system-ui', fontSize: fs,
      color: MD_C.onPrimaryContainer,
    }}>{l}</div>
  );
  const row = (keys, style = {}) => (
    <div style={{ display: 'flex', gap: 6, justifyContent: 'center', ...style }}>
      {keys.map(l => key(l))}
    </div>
  );
  return (
    <div style={{
      background: MD_C.inverseOnSurface, padding: '0 8px 8px',
      display: 'flex', flexDirection: 'column', gap: 4,
    }}>
      {/* navbar spacer (icons omitted) */}
      <div style={{ height: 44 }} />
      {/* key rows */}
      <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
        {row(['q','w','e','r','t','y','u','i','o','p'])}
        {row(['a','s','d','f','g','h','j','k','l'], { padding: '0 20px' })}
        <div style={{ display: 'flex', gap: 6 }}>
          {key('', { bg: MD_C.surfaceVariant })}
          <div style={{ display: 'flex', gap: 6, flex: 7, minWidth: 274 }}>
            {['z','x','c','v','b','n','m'].map(l => key(l))}
          </div>
          {key('', { bg: MD_C.surfaceVariant })}
        </div>
        <div style={{ display: 'flex', gap: 6 }}>
          {key('?123', { bg: MD_C.secondaryContainer, r: 100, minW: 58, fs: 14 })}
          {key(',', { bg: MD_C.surfaceVariant })}
          {key('', { flex: 3, minW: 154 })}
          {key('.', { bg: MD_C.surfaceVariant })}
          {key('', { bg: MD_C.primaryFixedDim, r: 100, minW: 58 })}
        </div>
      </div>
    </div>
  );
}

Object.assign(window, {
  AndroidDevice, AndroidStatusBar, AndroidAppBar, AndroidListItem, AndroidNavBar, AndroidKeyboard,
});

  blue50: '#f0f6ff', blue100: '#dbe9ff', blue200: '#b8d3ff',

  blue800: '#1e3a8a', blue900: '#172554',
  // Accent red
  red50: '#fef2f2', red100: '#fee2e2', red200: '#fecaca',
  red600: '#dc2626', red700: '#b91c1c',

// shadcn-style Button. Mobile-friendly heights.
function Button({ variant = 'default', size = 'default', full, icon, children, onClick, disabled, type }) {
  const bg = { default: NPGM.blue600, destructive: NPGM.red600, outline: '#fff', secondary: NPGM.s100, ghost: 'transparent', link: 'transparent' }[variant];
  const fg = { default: '#fff', destructive: '#fff', outline: NPGM.s900, secondary: NPGM.s900, ghost: NPGM.s700, link: NPGM.blue600 }[variant];
  const bd = { default: 'transparent', destructive: 'transparent', outline: NPGM.s300, secondary: 'transparent', ghost: 'transparent', link: 'transparent' }[variant];
  const h = { sm: 36, default: 44, lg: 48, icon: 44 }[size];
  const pad = { sm: '0 12px', default: '0 16px', lg: '0 24px', icon: 0 }[size];
  return (
    <button type={type || 'button'} onClick={disabled ? null : onClick} disabled={disabled} style={{
      height: h, padding: pad, background: bg, color: fg, border: `1px solid ${bd}`,
      borderRadius: 6, fontFamily: NPGM.fB, fontWeight: 500, fontSize: 14,
      cursor: disabled ? 'not-allowed' : 'pointer', opacity: disabled ? 0.5 : 1,
      width: full ? '100%' : 'auto', display: 'inline-flex', alignItems: 'center',
      justifyContent: 'center', gap: 8, boxSizing: 'border-box', whiteSpace: 'nowrap',
      transition: 'background 150ms',
    }}>{icon}{children}</button>
  );
}

function Input({ value, onChange, placeholder, type = 'text', id }) {
  return (
    <input id={id} type={type} value={value || ''}
      onChange={onChange ? e => onChange(e.target.value) : null} placeholder={placeholder}
      style={{
        height: 40, padding: '0 12px', borderRadius: 6,
        border: `1px solid ${NPGM.s300}`, fontFamily: NPGM.fB, fontSize: 14,
        color: NPGM.s900, outline: 'none', boxSizing: 'border-box', background: '#fff',
        boxShadow: '0 1px 2px rgba(15,23,42,0.04)', width: '100%',
      }}
    />
  );
}

function Field({ label, children, htmlFor, hint, error }) {
  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 4 }}>
      <label htmlFor={htmlFor} style={{ fontFamily: NPGM.fB, fontSize: 14, fontWeight: 500, color: NPGM.s700 }}>{label}</label>
      {children}
      {hint && <span style={{ fontFamily: NPGM.fB, fontSize: 12, color: error ? NPGM.red700 : NPGM.s500 }}>{hint}</span>}
    </div>
  );
}

// shadcn Badge — exact variants
function Badge({ variant = 'default', children, style }) {
  const v = {
    default:     { bg: NPGM.blue50, fg: NPGM.blue700, ring: NPGM.blue200 },
    secondary:   { bg: NPGM.s100,   fg: NPGM.s700,    ring: NPGM.s200 },
    success:     { bg: NPGM.em50,   fg: NPGM.em700,   ring: NPGM.em200 },
    warning:     { bg: NPGM.am50,   fg: NPGM.am700,   ring: NPGM.am200 },
    destructive: { bg: NPGM.red50,  fg: NPGM.red700,  ring: NPGM.red200 },
    outline:     { bg: 'transparent', fg: NPGM.s700,  ring: NPGM.s300 },
  }[variant];
  return (
    <span style={{
      display: 'inline-flex', alignItems: 'center', padding: '2px 8px',
      borderRadius: 6, background: v.bg, color: v.fg,
      boxShadow: `inset 0 0 0 1px ${v.ring}`,
      fontFamily: NPGM.fB, fontSize: 12, fontWeight: 500, whiteSpace: 'nowrap',
      ...style,
    }}>{children}</span>
  );
}

function Card({ children, padding = 16, style, onClick }) {
  const interactive = !!onClick;
  return (
    <div onClick={onClick} style={{
      background: '#fff', border: `1px solid ${NPGM.s200}`, borderRadius: 12,
      padding, cursor: interactive ? 'pointer' : 'default',
      transition: 'border-color 150ms, box-shadow 150ms', ...style,
    }}>{children}</div>
  );
}

function LocaleSwitcher({ lang, setLang, onDark }) {
  const pill = (code, flag) => {
    const active = lang === code;
    return (
      <button key={code} onClick={() => setLang(code)} style={{
        display: 'inline-flex', alignItems: 'center', gap: 6,
        padding: '4px 10px', borderRadius: 999,
        background: active ? NPGM.blue600 : (onDark ? 'rgba(255,255,255,0.1)' : '#fff'),
        color: active ? '#fff' : (onDark ? '#fff' : NPGM.s700),
        border: `1px solid ${active ? NPGM.blue600 : (onDark ? 'rgba(255,255,255,0.25)' : NPGM.s200)}`,
        fontFamily: NPGM.fB, fontWeight: 500, fontSize: 12, cursor: 'pointer',
      }}>
        <span style={{ fontSize: 13 }}>{flag}</span>{code}
      </button>
    );
  };
  return <div style={{ display: 'inline-flex', gap: 4 }}>{pill('RU','🇷🇺')}{pill('EN','🇬🇧')}</div>;
}

// Mesh-gradient hero, used on login & welcome. Pass children to render on top.
function MeshHero({ height = 220, children }) {
  return (
    <div style={{
      position: 'relative', height, flexShrink: 0, overflow: 'hidden',
      backgroundColor: '#0b1437',
      backgroundImage: [
        'radial-gradient(at 78% 8%,  #6366f1 0px, transparent 55%)',
        'radial-gradient(at 12% 22%, #1d4ed8 0px, transparent 50%)',
        'radial-gradient(at 88% 80%, #a855f7 0px, transparent 50%)',
        'radial-gradient(at 18% 88%, #312e81 0px, transparent 55%)',
        'radial-gradient(at 50% 50%, #1e3a8a 0px, transparent 60%)',
      ].join(','),
    }}>
      <div aria-hidden style={{
        position: 'absolute', inset: 0,
        backgroundImage: 'linear-gradient(to right, rgba(255,255,255,0.06) 1px, transparent 1px), linear-gradient(to bottom, rgba(255,255,255,0.06) 1px, transparent 1px)',
        backgroundSize: '40px 40px',
      }} />
      <div aria-hidden style={{ position: 'absolute', right: 0, top: 0, bottom: 0, width: 1, background: NPGM.red600 }} />
      {children}
    </div>
  );
}

// Sticky app top bar inside the device. Logo mark on left when no back, back arrow otherwise.
function AppTopBar({ title, onBack, lang, setLang }) {
  return (
    <div style={{
      display: 'flex', alignItems: 'center', gap: 10, padding: '10px 14px',
      borderBottom: `1px solid ${NPGM.s200}`, background: '#fff',
      position: 'sticky', top: 0, zIndex: 5, height: 56, boxSizing: 'border-box',
    }}>
      {onBack ? (
        <button onClick={onBack} style={{
          width: 36, height: 36, borderRadius: 6, border: 'none', background: 'transparent',
          display: 'grid', placeItems: 'center', cursor: 'pointer', marginLeft: -6,
        }}><Icons.ChevronL color={NPGM.s700} size={22} /></button>
      ) : (
        <img src={NPGM_LOGO_MARK} alt="" style={{ width: 28, height: 28 }} />
      )}
      <div style={{ flex: 1, minWidth: 0 }}>
        <div style={{ fontFamily: NPGM.fH, fontWeight: 600, fontSize: 16, color: NPGM.s900, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{title}</div>
      </div>
      <LocaleSwitcher lang={lang} setLang={setLang} />
    </div>
  );
}

function BottomNav({ tab, setTab, lang }) {
  const t = lang === 'RU'
    ? { home: 'Главная', shifts: 'Смены', tickets: 'Тикеты', ai: 'AI' }
    : { home: 'Home', shifts: 'Shifts', tickets: 'Tickets', ai: 'AI' };
  const items = [
    { id: 'home',    label: t.home,    icon: Icons.Home },
    { id: 'shifts',  label: t.shifts,  icon: Icons.Clipboard },
    { id: 'tickets', label: t.tickets, icon: Icons.MsgSquare },
    { id: 'ai',      label: t.ai,      icon: Icons.Bot },
  ];
  return (
    <div style={{
      display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)',
      borderTop: `1px solid ${NPGM.s200}`, background: '#fff', flexShrink: 0,
    }}>
      {items.map(it => {
        const active = tab === it.id;
        const Ic = it.icon;
        return (
          <button key={it.id} onClick={() => setTab(it.id)} style={{
            height: 60, border: 'none', background: 'transparent',
            display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center',
            gap: 2, cursor: 'pointer', color: active ? NPGM.blue600 : NPGM.s500,
          }}>
            <Ic size={20} color={active ? NPGM.blue600 : NPGM.s500} />
            <span style={{ fontFamily: NPGM.fB, fontSize: 11, fontWeight: active ? 600 : 500 }}>{it.label}</span>
          </button>
        );
      })}
    </div>
  );
}

Object.assign(window, { NPGM, Icons, Button, Input, Field, Badge, Card, LocaleSwitcher, MeshHero, AppTopBar, BottomNav });

      <div style={{ padding: '20px 16px 0', display: 'flex', flexDirection: 'column', gap: 10 }}>
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
            <Icons.Activity size={16} color={NPGM.em600} />
            <h3 style={{ fontFamily: NPGM.fH, fontSize: 15, fontWeight: 600, color: NPGM.s900, margin: 0 }}>{t.secActive}</h3>
          </div>
          <Button variant="outline" size="sm">{t.secActiveLink}<Icons.ChevronR size={14} color={NPGM.s700} /></Button>
        </div>
        {activeShifts.map(s => {
          const isBlocked = s.status === 'blocked';
          return (
            <div key={s.id} style={{
              display: 'flex', alignItems: 'center', gap: 10, padding: 12, borderRadius: 12,
              background: isBlocked ? '#fef2f240' : '#ecfdf540',
              border: `1px solid ${isBlocked ? NPGM.red200 : NPGM.em200}`,
            }}>
              <span style={{
                width: 8, height: 8, borderRadius: '50%', flexShrink: 0,
                background: isBlocked ? NPGM.red600 : NPGM.em500,
                animation: isBlocked ? null : 'pulse 1.6s infinite',
              }} />
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{ fontFamily: NPGM.fB, fontSize: 14, color: NPGM.s900, fontWeight: 500 }}>
                  {s.machine} <span style={{ fontSize: 12, color: NPGM.s500 }}>({s.type})</span>
                </div>
                <div style={{ fontFamily: NPGM.fB, fontSize: 12, color: NPGM.s600 }}>
                  {isBlocked ? t.blocked : t.inProgress}{t.planSuffix.replace('{tons}', s.plan)}
                </div>
              </div>
              <Icons.ChevronR size={16} color={NPGM.s400} />
            </div>
          );
        })}
      </div>

      {/* Upcoming maintenance */}
      <div style={{ padding: '20px 16px 0', display: 'flex', flexDirection: 'column', gap: 10 }}>
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
          <h3 style={{ fontFamily: NPGM.fH, fontSize: 15, fontWeight: 600, color: NPGM.s900, margin: 0 }}>{t.secUpcoming}</h3>
          <Button variant="outline" size="sm">{t.secUpcomingLink}<Icons.ChevronR size={14} color={NPGM.s700} /></Button>
        </div>
        {upcoming.map(u => {
          const isCritical = u.urgency === 'critical';
          const isHigh = u.urgency === 'high';
          const cardBg = isCritical ? '#fef2f230' : isHigh ? '#fffbeb30' : '#fff';
          const cardBorder = isCritical ? NPGM.red200 : isHigh ? NPGM.am200 : NPGM.s200;
          return (
            <div key={u.name} style={{
              background: cardBg, border: `1px solid ${cardBorder}`, borderRadius: 12, padding: 14,
              display: 'flex', alignItems: 'center', gap: 12,
            }}>
              <div style={{
                width: 36, height: 36, borderRadius: 8, background: NPGM.blue50, color: NPGM.blue700,
                display: 'grid', placeItems: 'center', flexShrink: 0,
              }}>
                {isCritical ? <Icons.Alert size={18} color={NPGM.red600} /> : <Icons.Truck size={18} color={NPGM.blue700} />}
              </div>
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{ display: 'flex', gap: 6, alignItems: 'center', flexWrap: 'wrap' }}>
                  <div style={{ fontFamily: NPGM.fB, fontSize: 14, fontWeight: 500, color: NPGM.s900 }}>{u.name}</div>
                  <Badge variant="outline" style={{ fontSize: 10 }}>{u.type}</Badge>
                </div>
                <div style={{ fontFamily: NPGM.fB, fontSize: 12, color: NPGM.s600, marginTop: 2 }}>
                  <strong style={{ color: NPGM.s900 }}>{u.kind}</strong> {t.kindThrough}{' '}
                  {isCritical ? (
                    <strong style={{ color: NPGM.red700, fontVariantNumeric: 'tabular-nums' }}>{lang === 'RU' ? 'сейчас' : 'now'}</strong>
                  ) : (
                    <strong style={{ color: NPGM.s900, fontVariantNumeric: 'tabular-nums' }}>{u.tons.toLocaleString('ru-RU')} {t.tonsUnit}</strong>
                  )}
                  {u.days > 0 && u.days < 365 && <> · {t.daysApprox.replace('{d}', u.days)}</>}
                </div>
              </div>
              <Button variant={isCritical ? 'default' : 'outline'} size="sm">{t.submitRequest}</Button>
            </div>
          );
        })}
      </div>

      {/* Quick access */}
      <div style={{ padding: '20px 16px 24px', display: 'flex', flexDirection: 'column', gap: 10 }}>
        <h3 style={{ fontFamily: NPGM.fH, fontSize: 15, fontWeight: 600, color: NPGM.s900, margin: 0 }}>{t.secQuick}</h3>
        {[
          { icon: Icons.Clipboard, title: t.quickShifts,  desc: t.quickShiftsDesc, onClick: () => onOpenShift() },
          { icon: Icons.MsgSquare, title: t.quickTicket,  desc: t.quickTicketDesc, onClick: () => onOpenTicket() },
        ].map(q => {
          const Ic = q.icon;
          return (
            <button key={q.title} onClick={q.onClick} style={{
              background: '#fff', border: `1px solid ${NPGM.s200}`, borderRadius: 12, padding: 14,
              display: 'flex', alignItems: 'center', gap: 12, cursor: 'pointer', textAlign: 'left',
              width: '100%',
            }}>
              <div style={{ width: 40, height: 40, borderRadius: 8, background: NPGM.blue50, display: 'grid', placeItems: 'center', flexShrink: 0 }}>
                <Ic size={20} color={NPGM.blue700} />
              </div>
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{ fontFamily: NPGM.fB, fontSize: 14, fontWeight: 500, color: NPGM.s900 }}>{q.title}</div>
                <div style={{ fontFamily: NPGM.fB, fontSize: 12, color: NPGM.s600, marginTop: 2, lineHeight: 1.4 }}>{q.desc}</div>
              </div>
              <Icons.ChevronR size={16} color={NPGM.s400} />
            </button>
          );
        })}
      </div>
    </div>
  );
}

// ============================================================
// Shift start — 3-step wizard
// ============================================================
function ShiftStartScreen({ lang }) {
  const t = lang === 'RU' ? {
    title: 'Старт смены', stepLbl: 'Шаг',
    s1: 'Машина', s2: 'Чек-лист', s3: 'План',
    machineLbl: 'Машина *', machinePlaceholder: 'Выберите машину…',
    machineDefault: 'МСЗУ-14-НПВ (МСЗУ · SN MZB-2024-0142 · Северный, блок А-2)',
    plannedFor: 'Дата смены',
    next: 'Далее', back: 'Назад', startBtn: 'Начать смену',
    checklistTitle: 'Чек-лист перед сменой',
    checklistHint: 'Для каждого пункта: OK — исправно; Не OK — есть проблема (опишите и приложите фото). Критическое «Не OK» блокирует смену и открывает тикет.',
    answerOk: 'OK', answerNotOk: 'Не OK', criticalBadge: 'Критический',
    problemPlaceholder: 'Опишите проблему…',
    items: [
      { name: 'Уровень масла в норме', critical: true },
      { name: 'Шины без видимых повреждений', critical: false },
      { name: 'Аварийный стоп исправен', critical: true },
      { name: 'Освещение работает', critical: false },
      { name: 'Огнетушитель на месте, годен', critical: true },
      { name: 'Уровень эмульсии в баке', critical: false },
    ],
    criticalWarnStrong: 'Критическое замечание чек-листа.',
    criticalWarnRest: ' Продолжение создаст смену в статусе «Заблокирована» — оператор не сможет начать работу до устранения. Это намеренно, не пытайтесь обойти.',
    planTitle: 'План зарядки',
    planSubtitle: 'Это план — фактические значения вы заполните при закрытии смены.',
    plannedTonsLbl: 'Плановый тоннаж, т', holesLbl: 'Количество скважин',
    recipeLbl: 'Состав', recipes: { ANFO: 'ANFO (100% AN + дизтопливо)', EMULSION: '100% эмульсия', BLEND_70_30: '70/30 (70% эм + 30% АН)', BLEND_30_70: '30/70', OTHER: 'Другое' },
    pitLbl: 'Блок / карьер', pitPlaceholder: 'Блок А, Карьер 2',
  } : {
    title: 'Start shift', stepLbl: 'Step',
    s1: 'Machine', s2: 'Checklist', s3: 'Plan',
    machineLbl: 'Machine *', machinePlaceholder: 'Select a machine…',
    machineDefault: 'MSZU-14-NPV (МСЗУ · SN MZB-2024-0142 · Northern, block A-2)',
    plannedFor: 'Shift date',
    next: 'Next', back: 'Back', startBtn: 'Start shift',
    checklistTitle: 'Pre-shift checklist',
    checklistHint: "For each item: OK — operational; Not OK — there's a problem (describe and attach a photo). A critical 'Not OK' blocks the shift and opens a Tier 2 ticket.",
    answerOk: 'OK', answerNotOk: 'Not OK', criticalBadge: 'Critical',
    problemPlaceholder: 'Describe the issue…',
    items: [
      { name: 'Oil level within range', critical: true },
      { name: 'Tyres free of visible damage', critical: false },
      { name: 'Emergency stop functional', critical: true },
      { name: 'Lighting operational', critical: false },
      { name: 'Fire extinguisher present, valid', critical: true },
      { name: 'Emulsion tank level', critical: false },
    ],
    criticalWarnStrong: 'Critical checklist failure.',
    criticalWarnRest: " Continuing will create a shift in 'Blocked' status — the operator cannot start work until resolved. This is intentional, do not try to bypass.",
    planTitle: 'Charging plan',
    planSubtitle: 'This is the plan — actual values will be entered when closing the shift.',
    plannedTonsLbl: 'Planned tonnage, t', holesLbl: 'Holes count',
    recipeLbl: 'Recipe', recipes: { ANFO: 'ANFO (100% AN + diesel)', EMULSION: '100% emulsion', BLEND_70_30: '70/30 (70% EM + 30% AN)', BLEND_30_70: '30/70', OTHER: 'Other' },
    pitLbl: 'Block / pit', pitPlaceholder: 'Block A, Pit 2',
  };

  const [step, setStep] = React.useState(1);
  const [answers, setAnswers] = React.useState(Array(t.items.length).fill(null));
  const setAns = (i, v) => setAnswers(prev => prev.map((a, j) => j === i ? v : a));
  const allAnswered = answers.every(a => a !== null);
  const hasCriticalFail = t.items.some((it, i) => it.critical && answers[i] === 'not_ok');

  const [planTons, setPlanTons] = React.useState('280');
  const [holes, setHoles] = React.useState('32');
  const [recipe, setRecipe] = React.useState('BLEND_70_30');
  const [pit, setPit] = React.useState('Северный, блок А-2');

  // Step indicator
  const stepDots = (
    <div style={{ display: 'flex', alignItems: 'center', gap: 8, padding: '12px 16px', background: '#fff', borderBottom: `1px solid ${NPGM.s200}` }}>
      {[1, 2, 3].map(n => (
        <React.Fragment key={n}>
          <div style={{
            display: 'inline-flex', alignItems: 'center', gap: 6,
            color: step >= n ? NPGM.blue700 : NPGM.s500,
          }}>
            <div style={{
              width: 22, height: 22, borderRadius: '50%',
              background: step >= n ? NPGM.blue600 : NPGM.s200,
              color: step >= n ? '#fff' : NPGM.s500,
              fontFamily: NPGM.fB, fontSize: 11, fontWeight: 600,
              display: 'grid', placeItems: 'center',
            }}>{step > n ? '✓' : n}</div>
            <span style={{ fontFamily: NPGM.fB, fontSize: 12, fontWeight: step === n ? 600 : 500, whiteSpace: 'nowrap' }}>
              {n === 1 ? t.s1 : n === 2 ? t.s2 : t.s3}
            </span>
          </div>
          {n < 3 && <div style={{ flex: 1, height: 1, background: step > n ? NPGM.blue200 : NPGM.s200 }} />}
        </React.Fragment>
      ))}
    </div>
  );

  return (
    <div style={{ flex: 1, background: NPGM.s50, overflowY: 'auto', display: 'flex', flexDirection: 'column' }}>
      {stepDots}

      <div style={{ flex: 1, padding: 16, display: 'flex', flexDirection: 'column', gap: 12 }}>
        {step === 1 && (
          <>
            <Field label={t.machineLbl}>
              <div style={{
                background: '#fff', border: `1px solid ${NPGM.s300}`, borderRadius: 6, padding: '10px 12px',
                display: 'flex', alignItems: 'center', gap: 8,
              }}>
                <Icons.Truck size={18} color={NPGM.blue700} />
                <div style={{ flex: 1, minWidth: 0, fontFamily: NPGM.fB, fontSize: 13, color: NPGM.s900 }}>{t.machineDefault}</div>
                <Icons.ChevronD size={16} color={NPGM.s400} />
              </div>
            </Field>
            <Field label={t.plannedFor}>
              <Input value="2026-05-22" />
            </Field>
          </>
        )}

        {step === 2 && (
          <>
            <Card padding={12} style={{ background: NPGM.blue50, borderColor: NPGM.blue200 }}>
              <div style={{ fontFamily: NPGM.fB, fontSize: 12, color: NPGM.blue700, lineHeight: 1.4 }}>{t.checklistHint}</div>
            </Card>
            {t.items.map((it, i) => {
              const ans = answers[i];
              const failed = ans === 'not_ok';
              return (
                <Card key={i} padding={12}>
                  <div style={{ display: 'flex', alignItems: 'flex-start', gap: 8, marginBottom: 10 }}>
                    <div style={{ flex: 1, fontFamily: NPGM.fB, fontSize: 14, color: NPGM.s900, fontWeight: 500 }}>{i + 1}. {it.name}</div>
                    {it.critical && <Badge variant="destructive">{t.criticalBadge}</Badge>}
                  </div>
                  <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 8 }}>
                    <button onClick={() => setAns(i, 'ok')} style={{
                      height: 44, borderRadius: 6,
                      background: ans === 'ok' ? NPGM.em50 : '#fff',
                      color: ans === 'ok' ? NPGM.em700 : NPGM.s700,
                      border: `1px solid ${ans === 'ok' ? NPGM.em500 : NPGM.s300}`,
                      fontFamily: NPGM.fB, fontWeight: 600, fontSize: 14, cursor: 'pointer',
                      display: 'inline-flex', alignItems: 'center', justifyContent: 'center', gap: 6,
                    }}>{ans === 'ok' && <Icons.Check size={16} color={NPGM.em600} />}{t.answerOk}</button>
                    <button onClick={() => setAns(i, 'not_ok')} style={{
                      height: 44, borderRadius: 6,
                      background: ans === 'not_ok' ? NPGM.red50 : '#fff',
                      color: ans === 'not_ok' ? NPGM.red700 : NPGM.s700,
                      border: `1px solid ${ans === 'not_ok' ? NPGM.red600 : NPGM.s300}`,
                      fontFamily: NPGM.fB, fontWeight: 600, fontSize: 14, cursor: 'pointer',
                    }}>{t.answerNotOk}</button>
                  </div>
                  {failed && (
                    <div style={{ marginTop: 10, display: 'flex', flexDirection: 'column', gap: 8 }}>
                      <textarea placeholder={t.problemPlaceholder} style={{
                        width: '100%', minHeight: 60, padding: 10, borderRadius: 6,
                        border: `1px solid ${NPGM.s300}`, fontFamily: NPGM.fB, fontSize: 14,
                        color: NPGM.s900, resize: 'vertical', boxSizing: 'border-box', outline: 'none',
                      }} />
                      <Button variant="outline" size="sm" icon={<Icons.Camera size={14} color={NPGM.s700} />}>{lang === 'RU' ? 'Добавить фото' : 'Attach photo'}</Button>
                    </div>
                  )}
                </Card>
              );
            })}
            {hasCriticalFail && (
              <Card padding={12} style={{ background: NPGM.red50, borderColor: NPGM.red200 }}>
                <div style={{ display: 'flex', gap: 8, alignItems: 'flex-start' }}>
                  <Icons.Alert size={18} color={NPGM.red600} />
                  <div style={{ fontFamily: NPGM.fB, fontSize: 12, color: NPGM.red700, lineHeight: 1.45 }}>
                    <strong>{t.criticalWarnStrong}</strong>{t.criticalWarnRest}
                  </div>
                </div>
              </Card>
            )}
          </>
        )}

        {step === 3 && (
          <>
            <div>
              <h4 style={{ fontFamily: NPGM.fH, fontSize: 16, fontWeight: 600, color: NPGM.s900, margin: '0 0 4px' }}>{t.planTitle}</h4>
              <div style={{ fontFamily: NPGM.fB, fontSize: 12, color: NPGM.s600 }}>{t.planSubtitle}</div>
            </div>
            <Field label={t.plannedTonsLbl}><Input value={planTons} onChange={setPlanTons} /></Field>
            <Field label={t.holesLbl}><Input value={holes} onChange={setHoles} /></Field>
            <Field label={t.recipeLbl}>
              <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
                {Object.entries(t.recipes).map(([id, label]) => {
                  const active = recipe === id;
                  return (
                    <button key={id} onClick={() => setRecipe(id)} style={{
                      height: 40, borderRadius: 6, textAlign: 'left',
                      background: active ? NPGM.blue50 : '#fff',
                      color: active ? NPGM.blue700 : NPGM.s700,
                      border: `1px solid ${active ? NPGM.blue600 : NPGM.s300}`,
                      fontFamily: NPGM.fB, fontWeight: active ? 600 : 500, fontSize: 13, cursor: 'pointer',
                      padding: '0 12px', display: 'flex', alignItems: 'center', gap: 8,
                    }}>
                      <span style={{
                        width: 14, height: 14, borderRadius: '50%',
                        border: `1px solid ${active ? NPGM.blue600 : NPGM.s400}`,
                        background: active ? NPGM.blue600 : '#fff', flexShrink: 0,
                        boxShadow: active ? `inset 0 0 0 3px #fff` : null,
                      }} />
                      {label}
                    </button>
                  );
                })}
              </div>
            </Field>
            <Field label={t.pitLbl}><Input value={pit} onChange={setPit} /></Field>
          </>
        )}
      </div>

      {/* Footer actions */}
      <div style={{ position: 'sticky', bottom: 0, background: '#fff', borderTop: `1px solid ${NPGM.s200}`, padding: 16, display: 'flex', gap: 8 }}>
        {step > 1 && <Button variant="outline" size="default" onClick={() => setStep(step - 1)}>{t.back}</Button>}
        <div style={{ flex: 1 }} />
        {step < 3 ? (
          <Button variant="default" size="default" onClick={() => setStep(step + 1)} disabled={step === 2 && !allAnswered}>{t.next}</Button>
        ) : (
          <Button variant={hasCriticalFail ? 'destructive' : 'default'} size="default">{t.startBtn}</Button>
        )}
      </div>
    </div>
  );
}

              const toneBg = isCrit ? NPGM.red50 : isHigh ? NPGM.am50 : NPGM.blue50;
              const toneText = isCrit ? NPGM.red700 : isHigh ? NPGM.am700 : NPGM.blue700;
              return (
                <button key={p.id} onClick={() => setPrio(p.id)} style={{
                  height: 44, borderRadius: 6, textAlign: 'left',

                  color: active ? toneText : NPGM.s700,
                  border: `1px solid ${active ? tone : NPGM.s300}`,

      </div>

        <Button variant="outline" size="default">{t.cancel}</Button>

        <Button variant="default" size="default">{t.submit}</Button>
      </div>
    </div>
  );
}

// ============================================================
// App shell — wraps everything inside the AndroidDevice frame
// ============================================================
function TabsBar({ screen, setScreen, screens }) {
  const node = document.getElementById('tabs');
  return ReactDOM.createPortal(
    <>{Object.entries(screens).map(([id, s]) => (
      <button key={id} className={'tab' + (screen === id ? ' active' : '')} onClick={() => setScreen(id)}>{s.label}</button>
    ))}</>, node
  );
}

function App() {
  const [screen, setScreen] = React.useState('login');
  const [lang, setLang] = React.useState('RU');

  const screens = {
    login:   { label: 'Login',         titleRU: '',                  titleEN: '' },
    home:    { label: 'Dashboard',     titleRU: 'Главная',           titleEN: 'Home' },
    shift:   { label: 'Start shift',   titleRU: 'Старт смены',       titleEN: 'Start shift' },
    ticket:  { label: 'New ticket',    titleRU: 'Новый тикет',       titleEN: 'New ticket' },
    ai:      { label: 'AI assistant',  titleRU: 'AI-помощник',       titleEN: 'AI assistant' },
  };

  let screenEl;
  if (screen === 'login') screenEl = <LoginScreen lang={lang} setLang={setLang} onLogin={() => setScreen('home')} />;
  else if (screen === 'home') screenEl = <DashboardScreen lang={lang} onOpenShift={() => setScreen('shift')} onOpenTicket={() => setScreen('ticket')} />;
  else if (screen === 'shift') screenEl = <ShiftStartScreen lang={lang} />;
  else if (screen === 'ticket') screenEl = <NewTicketScreen lang={lang} />;
  else if (screen === 'ai') screenEl = <AIChatScreen lang={lang} />;

  const inApp = screen !== 'login';
  const title = inApp ? (lang === 'RU' ? screens[screen].titleRU : screens[screen].titleEN) : null;
  const showBack = inApp && screen !== 'home';

  const bottomTab = ({
    home: 'home', shift: 'shifts', ticket: 'tickets', ai: 'ai',
  })[screen];

  const setBottomTab = (id) => {
    if (id === 'home') setScreen('home');
    else if (id === 'shifts') setScreen('shift');
    else if (id === 'tickets') setScreen('ticket');
    else if (id === 'ai') setScreen('ai');
  };

  return (
    <>
      <TabsBar screen={screen} setScreen={setScreen} screens={screens} />
      <AndroidDevice width={412} height={892}>
        <div style={{ display: 'flex', flexDirection: 'column', height: '100%' }}>
          {inApp && (
            <AppTopBar
              title={title}
              onBack={showBack ? () => setScreen('home') : null}
              lang={lang} setLang={setLang}
            />
          )}
          <div style={{ flex: 1, display: 'flex', flexDirection: 'column', minHeight: 0, overflow: 'hidden' }}>
            {screenEl}
          </div>
          {inApp && <BottomNav tab={bottomTab} setTab={setBottomTab} lang={lang} />}
        </div>
      </AndroidDevice>
    </>
  );
}

// Wait for globals to be defined before mounting (Babel inline scripts run async-ish)
const need = ['LoginScreen','DashboardScreen','ShiftStartScreen','NewTicketScreen','AIChatScreen','AppTopBar','BottomNav','AndroidDevice'];
let _t = 0;
const _w = (cb) => {
  if (need.every(n => window[n])) return cb();
  if (++_t > 200) { console.error('timed out, missing:', need.filter(n => !window[n])); return; }
  setTimeout(() => _w(cb), 30);
};
_w(() => ReactDOM.createRoot(document.getElementById('root')).render(<App />));
</script>
