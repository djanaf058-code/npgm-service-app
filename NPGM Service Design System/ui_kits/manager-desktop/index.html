function Badge({ variant = 'default', children, style }) {
  const v = {
    default:     { bg: NPGM.blue50, fg: NPGM.blue700, ring: NPGM.blue200 },
    secondary:   { bg: NPGM.s100,   fg: NPGM.s700,    ring: NPGM.s200 },
    success:     { bg: NPGM.em50,   fg: NPGM.em700,   ring: NPGM.em200 },
    warning:     { bg: NPGM.am50,   fg: NPGM.am700,   ring: NPGM.am200 },
    destructive: { bg: NPGM.red50,  fg: NPGM.red700,  ring: NPGM.red200 },
    outline:     { bg: 'transparent', fg: NPGM.s700,  ring: NPGM.s300 },
  }[variant];
  return (
    <span style={{
      display: 'inline-flex', alignItems: 'center', padding: '2px 8px',
      borderRadius: 6, background: v.bg, color: v.fg,
      boxShadow: `inset 0 0 0 1px ${v.ring}`,
      fontFamily: NPGM.fB, fontSize: 12, fontWeight: 500, whiteSpace: 'nowrap', ...style,
    }}>{children}</span>
  );
}

function Button({ variant = 'default', size = 'default', icon, children, onClick }) {
  const bg = { default: NPGM.blue600, destructive: NPGM.red600, outline: '#fff', secondary: NPGM.s100, ghost: 'transparent' }[variant];
  const fg = { default: '#fff', destructive: '#fff', outline: NPGM.s900, secondary: NPGM.s900, ghost: NPGM.s700 }[variant];
  const bd = { default: 'transparent', destructive: 'transparent', outline: NPGM.s300, secondary: 'transparent', ghost: 'transparent' }[variant];
  const h = { sm: 32, default: 36, lg: 40 }[size];
  const pad = { sm: '0 12px', default: '0 14px', lg: '0 24px' }[size];
  return (
    <button onClick={onClick} style={{
      height: h, padding: pad, background: bg, color: fg, border: `1px solid ${bd}`,
      borderRadius: 6, fontFamily: NPGM.fB, fontWeight: 500, fontSize: 13,
      cursor: 'pointer', display: 'inline-flex', alignItems: 'center', gap: 6,
      whiteSpace: 'nowrap', transition: 'background 150ms',
    }}>{icon}{children}</button>
  );
}

function LocaleSwitcher({ lang, setLang }) {
  const pill = (code, flag) => (
    <button key={code} onClick={() => setLang(code)} style={{
      display: 'inline-flex', alignItems: 'center', gap: 6,
      padding: '4px 10px', borderRadius: 999,
      background: lang === code ? NPGM.blue600 : '#fff',
      color: lang === code ? '#fff' : NPGM.s700,
      border: `1px solid ${lang === code ? NPGM.blue600 : NPGM.s200}`,
      fontFamily: NPGM.fB, fontWeight: 500, fontSize: 12, cursor: 'pointer',
    }}><span style={{ fontSize: 13 }}>{flag}</span>{code}</button>
  );
  return <div style={{ display: 'inline-flex', gap: 4 }}>{pill('RU','🇷🇺')}{pill('EN','🇬🇧')}</div>;
}

// MeshHero — same brand motif
function MeshHero({ height, radius = 12, children }) {
  return (
    <div style={{
      position: 'relative', height, borderRadius: radius, overflow: 'hidden', flexShrink: 0,
      backgroundColor: '#0b1437',
      backgroundImage: [
        'radial-gradient(at 78% 8%,  #6366f1 0px, transparent 55%)',
        'radial-gradient(at 12% 22%, #1d4ed8 0px, transparent 50%)',

              <tr>

                  <th key={i} style={{ textAlign: i === 4 ? 'right' : 'left', padding: '10px 16px', fontFamily: NPGM.fB, fontSize: 11, fontWeight: 600, color: NPGM.s500, letterSpacing: '0.04em', textTransform: 'uppercase', background: NPGM.s50, borderBottom: `1px solid ${NPGM.s200}` }}>{c}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {t.parts.map(p => (
                <tr key={p.sku} style={{ borderBottom: `1px solid ${NPGM.s100}` }}>
                  <td style={{ padding: '12px 16px', fontFamily: NPGM.fM, fontSize: 12, color: NPGM.s700 }}>{p.sku}</td>
                  <td style={{ padding: '12px 16px', color: NPGM.s900, fontWeight: 500 }}>{p.name}</td>
                  <td style={{ padding: '12px 16px', color: NPGM.s600 }}>{p.cat}</td>
                  <td style={{ padding: '12px 16px', color: NPGM.s600 }}>{p.use}</td>
                  <td style={{ padding: '12px 16px', textAlign: 'right', fontFamily: NPGM.fM, fontWeight: 600, fontVariantNumeric: 'tabular-nums', color: p.status === 'zero' ? NPGM.red700 : p.status === 'low' ? NPGM.am700 : NPGM.s900 }}>{p.qty}</td>
                  <td style={{ padding: '12px 16px' }}><Badge variant={stockTone[p.status]}>{stockLabel[p.status]}</Badge></td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </section>
    </div>
  );
}

Object.assign(window, { DashboardScreen, FleetScreen, MachineScreen, GarageScreen });


// Browser window chrome
function BrowserChrome({ url, children }) {
  return (
    <div style={{
      width: '100%', background: '#fff', borderRadius: 12, overflow: 'hidden',
      border: '1px solid #CBD5E1', boxShadow: '0 30px 80px rgba(15,23,42,0.15)',
      display: 'flex', flexDirection: 'column',
    }}>
      <div style={{ height: 36, background: '#F1F5F9', borderBottom: '1px solid #E2E8F0', display: 'flex', alignItems: 'center', padding: '0 14px', gap: 8 }}>
        <div style={{ display: 'flex', gap: 6 }}>
          <span style={{ width: 12, height: 12, borderRadius: '50%', background: '#FF5F57' }} />
          <span style={{ width: 12, height: 12, borderRadius: '50%', background: '#FEBC2E' }} />
          <span style={{ width: 12, height: 12, borderRadius: '50%', background: '#28C840' }} />
        </div>
        <div style={{ flex: 1, display: 'flex', justifyContent: 'center' }}>
          <div style={{ background: '#fff', border: '1px solid #E2E8F0', borderRadius: 6, padding: '4px 14px',
            fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, color: '#64748B', maxWidth: 440, minWidth: 240, textAlign: 'center' }}>{url}</div>
        </div>
        <div style={{ width: 56 }} />
      </div>
      <div style={{ flex: 1, minHeight: 0 }}>{children}</div>
    </div>
  );
}

function TabsBar({ screen, setScreen, screens }) {
  const node = document.getElementById('tabs');
  return ReactDOM.createPortal(
    <>{Object.entries(screens).map(([id, s]) => (
      <button key={id} className={'tab' + (screen === id ? ' active' : '')} onClick={() => setScreen(id)}>{s.label}</button>
    ))}</>, node
  );
}

function App() {
  const [screen, setScreen] = React.useState('home');
  const [lang, setLang] = React.useState('RU');
  const [selectedMachine, setSelectedMachine] = React.useState(null);

  const screens = {
    home:     { label: 'Dashboard', url: '/app' },
    machines: { label: 'Fleet',     url: '/app/machines' },
    machine:  { label: 'Machine',   url: '/app/machines/m1' },
    parts:    { label: 'Garage',    url: '/app/parts' },
  };

  // Sidebar id ↔ screen
  const sidebarId = ({ home: 'home', machines: 'machines', machine: 'machines', parts: 'parts' })[screen];
  const setSidebar = (id) => {
    if (id === 'home' || id === 'machines' || id === 'parts') setScreen(id);
  };

  let content;
  if (screen === 'home') content = <DashboardScreen lang={lang} />;
  else if (screen === 'machines') content = <FleetScreen lang={lang} onOpen={(id) => { setSelectedMachine(id); setScreen('machine'); }} />;
  else if (screen === 'machine') content = <MachineScreen lang={lang} machineId={selectedMachine || 'm1'} onBack={() => setScreen('machines')} />;
  else if (screen === 'parts') content = <GarageScreen lang={lang} />;

  return (
    <>
      <TabsBar screen={screen} setScreen={setScreen} screens={screens} />
      <BrowserChrome url={'app.npgm.ru' + screens[screen].url}>
        <div style={{ display: 'flex', height: 820, background: NPGM.s50 }}>
          <Sidebar active={sidebarId} setActive={setSidebar} lang={lang} role="project_manager" />
          <div style={{ flex: 1, display: 'flex', flexDirection: 'column', minWidth: 0 }}>
            <TopBar lang={lang} setLang={setLang} />
            <div style={{ flex: 1, overflowY: 'auto', background: NPGM.s50 }}>
              {content}
            </div>
          </div>
        </div>
      </BrowserChrome>
    </>
  );
}

const need = ['DashboardScreen','FleetScreen','MachineScreen','GarageScreen','Sidebar','TopBar'];
let _t = 0;
const _w = (cb) => {
  if (need.every(n => window[n])) return cb();
  if (++_t > 200) { console.error('timed out, missing:', need.filter(n => !window[n])); return; }
  setTimeout(() => _w(cb), 30);
};
_w(() => ReactDOM.createRoot(document.getElementById('root')).render(<App />));
</script>
</body>
</html>
