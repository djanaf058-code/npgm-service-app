      background-size: cover;
      background-position: center 40%;
    }
    /* Industrial scrim: deep blue at bottom for readability + slight warm-blend retention at top */
    .stage::before {
      content: ""; position: absolute; inset: 0;
      background:
        linear-gradient(180deg, rgba(11,20,55,0.10) 0%, rgba(11,20,55,0.45) 55%, rgba(11,20,55,0.85) 100%);
    }
    /* Brand red 1px stripe on the right edge — mirrors auth panel */
    .stage::after {
      content: ""; position: absolute; right: 0; top: 0; bottom: 0; width: 2px; background: #dc2626;
    }

    /* Top bar */
    .nav {
      position: relative; z-index: 2;
      display: flex; align-items: center; justify-content: space-between;
      padding: 28px 48px;
    }
    .nav .logo { height: 32px; filter: brightness(0) invert(1); display: block; }
    .lang { display: inline-flex; gap: 4px; }
    .lang button {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 12px; border-radius: 999px;
      background: rgba(255,255,255,0.08); color: #fff;
      border: 1px solid rgba(255,255,255,0.22);
      font: 500 13px 'Inter', sans-serif; cursor: pointer;
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      transition: background 150ms;
    }
    .lang button:hover { background: rgba(255,255,255,0.15); }
    .lang button.active { background: #1d4ed8; border-color: #1d4ed8; }
    .lang .flag { font-size: 15px; line-height: 1; }

    /* Hero content — bottom-anchored for industrial composition */
    .hero {
      position: relative; z-index: 2;
      padding: 80px 48px 64px;
      min-height: calc(100vh - 88px);
      display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center;
    }
    .eyebrow {
      font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 600;
      letter-spacing: 0.12em; text-transform: uppercase; color: #b8d3ff; margin-bottom: 18px;
    }
    .eyebrow .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #dc2626; margin-right: 10px; vertical-align: middle; }
    .title {
      font-family: 'IBM Plex Sans', sans-serif;
      font-weight: 700;
      font-size: clamp(48px, 8vw, 108px);
      line-height: 0.95;
      letter-spacing: -0.025em;
      margin: 0 0 24px;
      color: #fff;
    }
    .title .sub {
      display: block;
      font-size: 0.32em;
      font-weight: 500;
      color: #dbe9ff;
      letter-spacing: -0.005em;
      margin-top: 24px;
      line-height: 1.35;
      max-width: 22ch;
      margin-left: auto; margin-right: auto;
    }
    .description {
      max-width: 560px;
      font-size: 17px;
      line-height: 1.6;
      color: rgba(255,255,255,0.85);
      margin: 0 0 36px;
      font-weight: 400;
    }
    .description strong { color: #fff; font-weight: 600; }

    /* CTAs */
    .ctas { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      height: 52px; padding: 0 28px;
      border-radius: 8px;
      font: 500 15px 'Inter', sans-serif;
      cursor: pointer; transition: background 150ms, transform 100ms;
      text-decoration: none;
      border: 1px solid transparent;
    }
    .btn.primary { background: #dc2626; color: #fff; box-shadow: 0 8px 32px rgba(220, 38, 38, 0.40); }
    .btn.primary:hover { background: #b91c1c; }
    .btn.primary:active { transform: translateY(1px); }
    .btn.secondary { background: rgba(255,255,255,0.08); color: #fff; border-color: rgba(255,255,255,0.30); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
    .btn.secondary:hover { background: rgba(255,255,255,0.15); }
    .btn .arrow { display: inline-block; transition: transform 200ms; }
    .btn.primary:hover .arrow { transform: translateX(2px); }

    /* Footer micro-line at bottom right */
    .partner {
      position: absolute; right: 48px; bottom: 28px; z-index: 2;
      font-size: 12px; color: rgba(255,255,255,0.55);
      font-family: 'Inter', sans-serif; letter-spacing: 0.02em;
    }
    .partner strong { color: rgba(255,255,255,0.85); font-weight: 500; }

    @media (max-width: 720px) {
      .nav { padding: 20px 24px; }
      .hero { padding: 60px 24px 100px; }
      .title { font-size: clamp(40px, 11vw, 72px); }
      .description { font-size: 15px; }
      .ctas { width: 100%; }
      .ctas .btn { flex: 1; padding: 0 16px; }
      .partner { left: 24px; right: auto; bottom: 16px; font-size: 11px; }
    }
  </style>
</head>
<body>

  <script>
    const COPY = {
      RU: {
        eyebrow: 'NPGM Service App',
        title: 'NPGM',
        title2: 'Service',
        sub: 'Обслуживание и ремонт парка горной техники — в одном приложении.',
        register: 'Зарегистрироваться',
        signin: 'Войти',
      },
      EN: {
        eyebrow: 'NPGM Service App',
        title: 'NPGM',
        title2: 'Service',
        sub: 'Service and repair of your mining fleet — in one app.',
        register: 'Register',
        signin: 'Sign in',
      },
    };

    function render(lang) {
      const c = COPY[lang];
      document.getElementById('hero').innerHTML = `
        <div class="eyebrow"><span class="dot"></span>${c.eyebrow}</div>
        <h1 class="title">${c.title}<br>${c.title2}<span class="sub">${c.sub}</span></h1>
        <div class="ctas">
          <a href="#" class="btn primary">${c.register} <span class="arrow">→</span></a>
          <a href="#" class="btn secondary">${c.signin}</a>
        </div>
      `;
      document.documentElement.lang = lang.toLowerCase();
    }

    document.querySelectorAll('.lang button').forEach(b => {
      b.addEventListener('click', () => {
        document.querySelectorAll('.lang button').forEach(x => x.classList.remove('active'));
        b.classList.add('active');
        render(b.dataset.lang);
      });
    });

    render('RU');
  </script>
